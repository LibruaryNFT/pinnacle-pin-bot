name: Deploy reconciler

# Why this exists.
#
# GitHub does not create a workflow run for a push made with GITHUB_TOKEN.
# `auto-merge.yml` lands Dependabot patch/minor bumps with GITHUB_TOKEN, so
# those merges arrive on main and fire NOTHING. Measured across this estate on
# 2026-11-02: four services were running code behind their default branch at the
# same time, every one of them a dependency bump, and in each repo there was no
# `push` run for the merge at all -- only `pull_request`,
# `pull_request_target` and `workflow_run` events existed.
#
# In this repo the chain is test -> deploy, both on push to main, so a
# suppressed push run means neither runs. Measured 2026-11-02: vps1 served
# cad33ac from 10-26 while main was 7952cf5, four commits and seven days
# behind. This bot's failure mode is silence: it posts on a schedule, so a
# dead or stale process looks exactly like a quiet day on the Pinnacle market.
#
# A merged CVE fix that is not running is indistinguishable from one that is,
# and Dependabot reports the PR as closed either way.
#
# The exemption GitHub documents needs no credential and cannot expire:
#
#   "workflow_dispatch and repository_dispatch events ALWAYS create workflow
#    runs" -- including when GITHUB_TOKEN starts them.
#   https://docs.github.com/en/actions/concepts/security/github_token
#
# A PAT would also work and is deliberately NOT used. vaultopolis tried exactly
# that (MERGE_TOKEN, a fine-grained PAT) and removed it: the token expired and
# guaranteed the same outage on a later date. See
# vaultopolis/.github/workflows/deploy-reconciler.yml, which is the template
# this file is ported from.
#
# It is a reconciler, not a trigger, and that is deliberate: it also catches a
# run that was cancelled, a run lost to retention, and a merge path nobody has
# thought of yet. A trigger has to be wired into every merge path; a reconciler
# only has to be able to read main.
#
# Bounded behaviour worth knowing about. Deploy's own trigger filters mean a
# commit that legitimately needs no deploy can still look like a missing run
# here, so this will dispatch once for it. Once, not repeatedly: the dispatched
# run's head_sha IS the tip, so the next cycle sees it and exits OK. The
# invariant is one dispatch per SHA.
#
# deploy.yml ignores *.md, docs/**, LICENSE and .gitignore on push, so a docs-
# only tip is the case that can draw one spurious dispatch here. That dispatch
# restarts the bot once.
#
# Cost. GitHub bills each job rounded up to a whole minute and this account is
# at 230% of its allowance, so this is ONE job with no matrix, every 6 hours,
# exiting in seconds on the common path: ~120 billed minutes a month. Worst-case
# lag on a suppressed merge is 6 hours, against "never, until someone notices".

on:
  schedule:
    # 37 past, every 6th hour. Off the hour on purpose: GitHub delays scheduled
    # runs at :00 the hardest. Staggered against the other repos' reconcilers so
    # four deploys never land on the fleet in the same minute.
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # To read deploy.yml's runs and to dispatch one. Nothing else.
  actions: write

concurrency:
  group: deploy-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    name: Does main's tip have a deploy run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch deploy for main if its tip has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: |
          set -euo pipefail

          sha=$(gh api "/repos/$REPO/commits/$BRANCH" --jq .sha)
          echo "$BRANCH tip: $sha"

          # Every run of deploy.yml against this exact commit, whatever started
          # it: push, workflow_run, workflow_dispatch, or a re-run. A queued or
          # in-progress run counts -- it has not failed, and dispatching a
          # second one would race the first onto the same host.
          runs=$(gh api \
            "/repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.path == ".github/workflows/deploy.yml")
                   | {status, conclusion, event, id}]')
          echo "$runs" | jq -c '.[]' || true

          live=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')
          good=$(printf '%s' "$runs" | jq '[.[] | select(.conclusion == "success")] | length')

          if [ "$live" -gt 0 ] || [ "$good" -gt 0 ]; then
            echo "OK: $sha has $good passing and $live in-flight deploy run(s)."
            exit 0
          fi

          # A run exists and FAILED. Dispatching another would re-run a known
          # failure on a schedule and bill for it four times a day. A failing
          # deploy is a thing to fix, not to retry, and the deploy workflow's
          # auto-undo job has already rolled back to the last healthy commit
          # and paged. (That undo run is a success on this same tip, so the
          # check above normally exits OK before reaching here.)
          #
          # Only `failure` holds. `cancelled`, `timed_out`, `stale` and
          # `action_required` all fall through to a dispatch on purpose: those
          # are runs that never reached a verdict, so there is nothing to
          # respect, and treating them as failures would wedge this job
          # permanently on a tip whose run someone cancelled by hand.
          failed=$(printf '%s' "$runs" | jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$failed" -gt 0 ]; then
            echo "HOLD: $sha has $failed failed deploy run(s) and no passing one."
            echo "That is a broken deploy, not an undeployed commit. Not dispatching."
            exit 0
          fi

          echo "No deploy run exists for $sha. Dispatching deploy.yml against $BRANCH."
          gh workflow run deploy.yml -R "$REPO" --ref "$BRANCH"
          sleep 10
          gh run list -R "$REPO" --workflow deploy.yml --limit 3 \
            --json databaseId,event,status,headSha \
            --jq '.[] | "\(.databaseId) \(.event) \(.status) \(.headSha[0:8])"'
